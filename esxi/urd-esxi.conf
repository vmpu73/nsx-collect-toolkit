# ===========================================================================
#  urd-esxi.conf - settings for scripts that run ON an ESXi host
#
#  ALREADY FILLED IN (<CASE_ID> known values):
#      WORKER_VMS, NODE_PORT 31820, PROTO udp
#
#  YOU must FILL IN - only 2:
#      HOST_TAG      short name of this host (any string, used in filenames)
#      UPLINK_NICS   from: esxcli network nic list   (Link status = Up)
#
#  Put this file and the scripts in /tmp/urd/ and run them as root.
#  Note: ESXi uses busybox sh. No bash syntax. No 'tr'. Use 'which', not 'command -v'.
# ===========================================================================

# --- host identity -------------------------------------------------------
HOST_TAG="esx01"

# --- worker node VM names ------------------------------------------------
# Must match the name after "vmm0:" in summarize-dvfilter output.
# VMs not present on this host are skipped automatically, so listing all is fine.
#
# Warning: this is the scope of the whole collection
# This is a troubleshooting tool, not a host assessment. nothing is collected
# for a VM that is not named here - no capture, no flows, no port stats.
# If this is empty the scripts collect no per-VM data at all and say so.
# They never fall back to "everything on the host".
#
# The two host-wide commands are filtered down to these names as well:
#     net-stats -l          -> A2-portlist.txt
#     summarize-dvfilter    -> A1-dvfilter-list.txt
# Raw, they list every VM on the hypervisor. Measured on the lab host: 14
# powered-on VMs, 11 of them unrelated (vCenter, log server, other tenants).
# That output goes into a bundle attached to a customer SR, so it is cut down
# to the VMs above. Lab result: 181 lines -> 25 lines.
# FULL_HOST=1 keeps the raw output. Opt-in only:
#     FULL_HOST=1 sh urd-esxi-dfw-sessions.sh once
WORKER_VMS="<WORKER_VM_1> <WORKER_VM_2> <WORKER_VM_3>"

# vNIC to capture.  RECOMMENDED: leave it EMPTY.
#
# It is a LIST, not one name, because the VMs in WORKER_VMS do not have to
# use the same vNIC names. Tokens are space separated and can be mixed:
#
#   WORKER_VNIC=""                          every vNIC of every VM   <- default
#   WORKER_VNIC="eth0"                      eth0 on every VM
#   WORKER_VNIC="web01:eth1"                that VM, that vNIC only
#   WORKER_VNIC="web02:eth2,eth3"           two vNICs of one VM (comma)
#   WORKER_VNIC="web01:eth1 web02:eth2,eth3"    the mixed case
#   WORKER_VNIC="eth0 web02:eth6"           eth0 is the default, web02 differs
#
# Rules:
#   - A VM that has its own "vm:..." entry uses only that.
#   - A VM with no entry falls back to the bare tokens ("eth0" above).
#   - No bare token and no entry -> all of that VM's vNICs.
#   - Write the vNIC name as it appears in the DFW filter: eth0, eth1, eth6.
#     "web02.eth0" (the ClientName net-stats prints) is accepted too and is
#     read as "web02:eth0", so a net-stats line can be pasted directly.
#   - VM names must not contain spaces.
#
# HOW TO CHECK what each VM actually has - one command:
#
#     sh urd-esxi-dfw-sessions.sh map
#
#   VM                     vNIC   DFW filter                       port
#   web01                  eth0   nic-9041269-eth0-vmware-sfw.2    67108942
#   web02                  eth0   nic-7933383-eth0-vmware-sfw.2    67108940
#
#   One line per vNIC. If a VM shows several lines and you only want one of
#   them, that is when you write "vm:nic". Otherwise leave this empty.
#
#   The same thing straight from the hypervisor:
#     net-stats -l | grep '<VM name>\.'
#   ClientName is "<VM>.<vNIC>", with the MAC and switch port on the same line.
#
# IF A VM HAS several vNICs - find the one on the node network:
#
#   (a) by portgroup - most reliable
#       W=$(esxcli network vm list | awk '$2=="<VM name>"{print $1}')
#       esxcli network vm port list -w $W | grep -E '^ +Port ID:|Portgroup:|MAC Address:'
#       Pick the vNIC whose Portgroup is the K8s node segment, then match its
#       MAC against the net-stats output above to get the ethN name.
#
#   (b) by guest IP - needs VMware Tools
#       ID=$(vim-cmd vmsvc/getallvms | awk '/<VM name>/{print $1; exit}')
#       vim-cmd vmsvc/get.guest $ID | grep -E 'macAddress|ipAddress ='
#       Find the MAC that owns the node IP (= the LB pool member IP), then
#       match it against the net-stats output.
#
#   Warning: the "IP Address" field of "esxcli network vm port list" is
#   useless - it shows 0.0.0.0 for every VM. Use Portgroup and MAC only.
#
# WHY EMPTY is USUALLY RIGHT: a vNIC with no matching traffic only produces a
# 68 byte empty pcap, so capturing all of them costs nothing, while picking
# the wrong one loses the whole capture window.
WORKER_VNIC=""

# --- capture filter ------------------------------------------------------
# NodePort is the only discriminator at the DFW point.
# The node's own IP is on every packet of that vNIC, so it has no selectivity.
NODE_PORT="31820"
PROTO="udp"                 # udp | tcp

# LB SNAT IP - optional, narrows volume further.
# Leave EMPTY unless you are sure the LB does SNAT. If it does not,
# setting this yields zero packets.
LB_SNAT_IP=""

# --- physical uplinks (for stats only) -----------------------------------
# From: esxcli network nic list   (Link status = Up)
UPLINK_NICS="vmnic0 vmnic1"

# ===========================================================================
#  RUN SETTINGS - grouped by WHICH SCRIPT READS THEM
#
#  Two completely independent groups. They do not interact.
#    group 1  CAP_*                -> only the two DFW capture scripts
#    group 2  INTERVAL / DURATION  -> only the two polling scripts
#  A capture script never looks at INTERVAL or DURATION.
#  A polling script never looks at any CAP_* value.
# ===========================================================================

# --- read by all scripts -------------------------------------------------
OUT="/tmp/urd-out"
#   Danger: /tmp on ESXi is a ramdisk, not disk
#   Roughly 250 MB on a normal host, and it is host memory - filling it is a
#   host problem, not a file problem. The scripts refuse to start a capture
#   whose ring buffer would not fit, and the polling loops stop themselves at
#   MIN_FREE_MB (default 200).
#   The shipped CAP_FILESIZE/CAP_FILECOUNT below are small on purpose so a
#   short run works out of the box on the ramdisk.
#   FOR THE REAL 90 MINUTE WINDOW, PUT this ON A DATASTORE:
#       OUT="/vmfs/volumes/<datastore>/urd-out"
#   find one with:  df -m
#   then raise CAP_FILESIZE/CAP_FILECOUNT to 100/5 again.

# --- read only by ---------------------------------------------------------
#       urd-esxi-cap-dfw-pre.sh
#       urd-esxi-cap-dfw-post.sh
# -------------------------------------------------------------------------
CAP_SECS=600                # how long to capture, seconds   -> pktcap-uw -G
                            #   10 min. This is what ends the capture.
CAP_SNAPLEN=""              # bytes kept per packet. EMPTY = whole packet (default).
#   Only set this if the capture files get too big. It truncates every packet,
#   so the payload is lost - you can still see who talked to whom, but not what
#   they said.
#   For this case it buys almost nothing: RADIUS packets are mostly under
#   256 bytes anyway. Measured in the lab over 50 packets:
#       no -s      -> 7578 bytes  (151 B/packet)
#       -s 256     -> 7358 bytes  (147 B/packet)   about 3 percent smaller
#   Truncating only pays off for bulk TCP (1500 byte frames), not for this.
#   If EAP is in use the RADIUS packets can be much larger, and truncating
#   them would throw away exactly the part you need.
CAP_FILESIZE=20             # MB per file                    -> pktcap-uw -C
CAP_FILECOUNT=2             # number of ring buffer files    -> pktcap-uw -W
#
#   How the last two work together:
#     file1 fills -> file2 -> ... -> file5 -> file1 is OVERWRITTEN
#     Max disk    = CAP_FILESIZE * CAP_FILECOUNT = 500 MB
#     Rough capacity at snaplen 256: about 370,000 packets per 100 MB file.
#
#   Warning: if more than 500 MB arrives within CAP_SECS, the beginning of
#   the capture is silently overwritten. Check afterwards:
#     only  <name>.pcap0            -> nothing rotated, everything is there
#     also  <name>.pcap1, .pcap2 .. -> it rotated; 3+ files means the start
#                                      of the window is probably gone.
#   Also mind /tmp free space:  df -h /tmp
#   Note: these files are PER vNIC and PER stage (pre and post), so the real
#   worst case is 500 MB x (number of vNICs) x 2.

# --- read only by ---------------------------------------------------------
#       urd-esxi-stats.sh
#       urd-esxi-dfw-sessions.sh
#   Nothing to do with packet capture. These scripts just run a set of
#   commands over and over and append the output to files.
# -------------------------------------------------------------------------
INTERVAL=30                 # seconds between samples
DURATION=1200               # total run time, seconds (20 min)
#   -> 1200 / 30 = 40 samples.
#   Set DURATION a bit longer than CAP_SECS so you have state from before
#   and after the capture window.
