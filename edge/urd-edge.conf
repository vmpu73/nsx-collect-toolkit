# ===========================================================================
#  urd-edge.conf - settings for scripts that run ON one NSX Edge
#
#  ALREADY FILLED IN (<CASE_ID> known values):
#      VIP <VIP> / NAT <NAT_IP> / CLIENT <CLIENT_IP>
#      PROTO udp / SVC_PORT 1812 / NODE_PORT 31820
#
#  YOU must FILL IN - only these:
#      EDGE_TAG            short name of this Edge (any string, used in filenames)
#      LIF_VPCT1_UPLINK    VPC T1 SR, Port-type: uplink    (only on the VPC T1 Edge)
#      LIF_LBT1_SVC        LB  T1 SR, Port-type: service   (only on the LB  T1 Edge)
#      LB_SNAT_IP          "Snat IP" from: get load-balancer <LB> pool <POOL> snat-pools
#      LB_UUID / LB_POOL_UUIDS   only if you also collect sessions
#
#  Anything this Edge does not host: leave EMPTY. The scripts skip it.
#  Put this file and the scripts in /root/urd/ and run them as root.
# ===========================================================================

# --- Edge identity -------------------------------------------------------
EDGE_TAG="edge01"

# --- service addresses ---------------------------------------------------
VIP="<VIP>"          # LB virtual server IP
NAT_IP="<NAT_IP>"       # external NAT IP - also matched, in case NAT is
                            # still un-translated at the VPC T1 uplink
CLIENT_IP="<CLIENT_IP>"     # IoT client IP - safety net: if the source is
                            # preserved we still catch the flow even when the
                            # destination was translated to something else.
                            # May be left empty.

# LB SNAT IP. Get it with:
#   su admin -c "get load-balancer <LB-UUID> pool <POOL-UUID> snat-pools"
#   -> the "Snat IP :" value. For a one-arm LB this is usually the same as the
#      T1 service interface IP. If SNAT uses a pool, write a range instead,
#      e.g. LB_SNAT_IP="net 192.168.13.0/28"
LB_SNAT_IP=""

# --- ports ---------------------------------------------------------------
PROTO="udp"                 # protocol of this service. RADIUS is udp
SVC_PORT="1812"             # client -> VIP
NODE_PORT="31820"           # LB SNAT -> worker node (NodePort)

# --- capture interfaces (LIF UUIDs) --------------------------------------
# Get them with:
#   su admin -c "get logical-routers"                    -> find the SR UUID
#   su admin -c "get logical-router <SR-UUID> interfaces"
#   then pick by "Port-type": uplink / service
# Leave empty what this Edge does not host.
LIF_VPCT1_UPLINK=""
LIF_LBT1_SVC=""

# --- logical routers -----------------------------------------------------
#  Danger: this runs on a production Edge
#  urd-edge-stats.sh collects per-router interface stats and HA state only for
#  the UUIDs listed here. Measured cost per router on a real Edge:
#      get logical-router <uuid> interfaces stats         1633 ms
#      get logical-router <uuid> high-availability status   847 ms
#  = about 2.5 s each. An Edge hosting 100 T1s would need 250 s per sample,
#  so INTERVAL=30 could never be met and the control plane would be hammered.
#
#  Set the ones you actually care about. Leave the rest empty - they are
#  skipped, no error.
#  If all THREE are empty the script falls back to discovering every service
#  router on the Edge, and REFUSES if there are more than SR_MAX (default 10).
#  Get the UUIDs with:  su admin -c "get logical-routers"
T0_SR_UUID=""
T1_VPC_SR_UUID=""
T1_LB_SR_UUID=""
LIF_T0_UPLINK=""
LIF_VPCT1_DOWNLINK=""
LB_UUID=""
LB_POOL_UUIDS=""

# --- physical interfaces -------------------------------------------------
FP_PORTS="fp-eth0 fp-eth1"

# ===========================================================================
#  RUN SETTINGS - grouped by WHICH SCRIPT READS THEM
#
#  There are two completely independent groups. They do not interact.
#    group 1  CAP_*                -> only the two capture scripts
#    group 2  INTERVAL / DURATION  -> only the two polling scripts
#  A capture script never looks at INTERVAL or DURATION.
#  A polling script never looks at any CAP_* value.
# ===========================================================================

# --- read by all scripts -------------------------------------------------
OUT="/var/dump/urd"         # where results are written. /var/dump has the
                            #   most free space on an Edge.

# --- read only by ---------------------------------------------------------
#       urd-edge-cap-vpct1-uplink.sh
#       urd-edge-cap-lbt1-svc.sh
# -------------------------------------------------------------------------
CAP_SECS=600                # how long to capture, seconds      -> timeout -s INT
                            #   10 min. This is the only thing that ends the
                            #   capture; -C/-W below never stop it by themselves.
CAP_SNAPLEN=""              # bytes kept per packet. EMPTY = whole packet (default).
#   Only set this if the capture files get too big. It truncates every packet,
#   so the payload is lost - you can still see who talked to whom, but not what
#   they said.
#   For this case it buys almost nothing: RADIUS packets are mostly under
#   256 bytes anyway. Measured in the lab over 50 packets:
#       no -s      -> 7578 bytes  (151 B/packet)
#       -s 256     -> 7358 bytes  (147 B/packet)   about 3 percent smaller
#   Truncating only pays off for bulk TCP (1500 byte frames), not for this.
#   If EAP is in use the RADIUS packets can be much larger, and truncating
#   them would throw away exactly the part you need.
CAP_FILESIZE=100            # MB per file                       -> tcpdump -C
CAP_FILECOUNT=5             # number of ring buffer files       -> tcpdump -W
#
#   How the last two work together:
#     file1 fills -> file2 -> ... -> file5 -> file1 is OVERWRITTEN
#     Max disk    = CAP_FILESIZE * CAP_FILECOUNT = 500 MB
#     Rough capacity at snaplen 256: about 370,000 packets per 100 MB file,
#     so ~1.8 million packets in total.
#
#   Warning: if more than 500 MB arrives within CAP_SECS, the beginning of
#   the capture is silently overwritten. Check afterwards:
#     only  <name>.pcap0            -> nothing rotated, everything is there
#     also  <name>.pcap1, .pcap2 .. -> it rotated; 3+ files means the start
#                                      of the window is probably gone.
#   If that happens, raise CAP_FILESIZE or shorten CAP_SECS.

# span session id. Must be different for each capture: if both captures run
# on the same Edge with the same id they overwrite each other.
CAP_SESSION_VPCT1=0         # used by urd-edge-cap-vpct1-uplink.sh
CAP_SESSION_LBT1=1          # used by urd-edge-cap-lbt1-svc.sh

# --- read only by ---------------------------------------------------------
#       urd-edge-stats.sh
#       urd-edge-sessions.sh
#   Nothing to do with packet capture. These scripts just run a set of
#   "get ..." commands over and over and append the output to files.
# -------------------------------------------------------------------------
INTERVAL=30                 # seconds between samples
DURATION=1200               # total run time, seconds (20 min)
#   -> 1200 / 30 = 40 samples.
#   Set DURATION a bit longer than CAP_SECS so you have state from before
#   and after the capture window.
