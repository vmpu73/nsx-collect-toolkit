# ===========================================================================
#  nsx-collector.conf - the ONE config for nsx-collector.sh (NSX Edge and ESXi)
#
#  The same file works on both. Fill in what the box you are on needs and
#  leave the rest empty - empty is always "skip this", never "everything".
#
#  REQUIRED, per box:
#     on an NSX Edge : LIF_LBT1_SVC and/or LIF_VPCT1_UPLINK  (interface UUID)
#     on an ESXi host: WORKER_VMS                            (VM names)
#  Everything else is optional.
#
#  VALUES MAY HOLD SEVERAL ENTRIES, separated by spaces:
#     PORTS="1812 1813"      HOSTS="10.1.1.10 10.1.1.11 10.1.1.0/28"
#     PROTO="udp tcp"        WORKER_VMS="k8s-w01 k8s-w02"
#  An unfilled "<...>" placeholder counts as empty.
#
#  Do NOT edit this file in a Windows editor or paste it through a messenger.
#  It must keep UNIX line endings. nsx-collector.sh refuses to run otherwise and tells
#  you how to fix it.
# ===========================================================================

# --- identity --------------------------------------------------------------
CASE_ID=""                  # e.g. "ISCPSR-49099". Only used on screen.
TAG=""                      # short name in file names. Empty = host name.

# --- where results go ------------------------------------------------------
#   empty = Edge /var/dump/nsx-collect , ESXi /tmp/nsx-collect
#   ESXi /tmp is a ~250 MB RAMDISK. For a long capture use a datastore:
#   OUT="/vmfs/volumes/<datastore>/urd"
OUT=""

# ===========================================================================
#  WHAT TO CAPTURE - two ways. Use whichever you like.
#
#  (1) FILTER - a free pcap/tcpdump expression, with and / or / not / ( ).
#      This wins over everything below when it is set.
#         FILTER="host 10.1.1.10 and (udp port 1812 or udp port 1813)"
#         FILTER="(host 10.1.1.10 or host 10.1.1.11) and not tcp port 22"
#         FILTER="net 10.1.1.0/28 and udp"
#      Notes:
#         - "host" / "net" may be left out in front of an address; nsx-collector.sh
#           puts it in for you (a bare IP is a syntax error for tcpdump).
#         - and / or have the SAME precedence and are read left to right.
#           "a or b and c" means "(a or b) and c". Use ( ) to be sure.
#         - the expression is syntax-checked before anything starts.
#         - on ESXi the capture is filtered through tcpdump-uw, so ONE file
#           per vNIC and stage - no file explosion.
#
#  (2) The simple fields - HOSTS / PROTO / PORTS and the Edge/ESXi specific
#      ones further down. Any of them may be empty or hold several values.
#      Empty everywhere = capture every packet on the interface.
# ===========================================================================
FILTER=""

# --- simple fields (used when FILTER is empty) -----------------------------
HOSTS=""                    # any address of interest: "10.1.1.10 10.1.1.0/28"
PROTO=""                    # "udp" / "tcp" / "icmp", or several: "udp tcp"
PORTS=""                    # "1812" or "1812 1813"

# ===========================================================================
#  NSX EDGE part
# ===========================================================================
# --- capture interfaces (REQUIRED on an Edge, at least one) ----------------
# Find them on the Edge:
#   su admin -c "get logical-routers"                     -> the SR UUID
#   su admin -c "get logical-router <SR-UUID> interfaces" -> pick by Port-type
#     Port-type: uplink  -> LIF_VPCT1_UPLINK
#     Port-type: service -> LIF_LBT1_SVC
# Run on the Edge that is ACTIVE for that T1 (menu "check" tells you).
LIF_VPCT1_UPLINK=""
LIF_LBT1_SVC=""

# --- Edge specific addresses/ports (used when FILTER is empty) -------------
VIP=""                      # LB virtual server IP
NAT_IP=""                   # public/NAT address before DNAT
CLIENT_IP=""                # client address, single or range
LB_SNAT_IP=""               # LB SNAT address ("get load-balancer .. snat-pools")
SVC_PORT=""                 # client -> VIP           (e.g. 1812)
NODE_PORT=""                # LB -> backend/NodePort  (e.g. 31820)

# --- routers / LB to collect state for (optional, empty = skipped) ---------
# One router costs about 2.5 s per sample, so name only what you care about.
T0_SR_UUID=""
T1_VPC_SR_UUID=""
T1_LB_SR_UUID=""
LB_UUID=""
LB_POOL_UUIDS=""
FP_PORTS="fp-eth0 fp-eth1"  # physical ports for counters

# --- span session ids (leave as is unless they are already in use) ---------
CAP_SESSION_VPCT1=0
CAP_SESSION_LBT1=1

# ===========================================================================
#  ESXi part
# ===========================================================================
# --- worker VMs (REQUIRED on ESXi) -----------------------------------------
# Names as shown by:  vim-cmd vmsvc/getallvms
# VMs that are not on this host are skipped with a note - listing all is fine.
# Nothing per VM is collected for a VM that is not named here.
WORKER_VMS=""
WORKER_VNIC=""              # empty = every vNIC of those VMs (recommended)
UPLINK_NICS=""              # e.g. "vmnic0 vmnic1", for NIC counters

# ===========================================================================
#  RUN SETTINGS
#    CAP_*                -> the packet captures only
#    INTERVAL / DURATION  -> the state/session polling only
# ===========================================================================
CAP_SECS=600                # capture length, seconds (ended by timeout)
CAP_SNAPLEN=""              # bytes per packet. empty = whole packet
CAP_FILESIZE=100            # MB per file   (ESXi: lowered automatically if
CAP_FILECOUNT=5             # files in ring  the ramdisk cannot hold it)
INTERVAL=30                 # seconds between state samples
DURATION=1200               # total polling time, seconds
MIN_FREE_MB=""              # stop floor. empty = Edge 1024, ESXi 64
